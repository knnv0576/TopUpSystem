# 本機 DEMO：對外只開放 127.0.0.1:8443，資料庫與內部 port 都不對外。
x-php: &php
  image: topup-php:8.5.12
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  volumes:
    - .:/var/www/html
    # 套件放在 Docker volume：F 槽經由 9p 共享，讀 8,000 多個套件檔非常慢。
    - vendor:/var/www/html/vendor
  restart: unless-stopped

services:
  # 一次性工作：產生自簽憑證，並把專案目錄交給 www-data。
  init:
    image: topup-php:8.5.12
    user: root
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - certs:/certs
    environment:
      COMPOSER_HOME: /tmp/composer
      COMPOSER_ALLOW_SUPERUSER: "1"
    command:
      - sh
      - -c
      - |
        [ -f /certs/server.crt ] || openssl req -x509 -newkey rsa:2048 -nodes -days 825 \
          -keyout /certs/server.key -out /certs/server.crt -subj "/CN=localhost" \
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
        chmod 644 /certs/server.crt /certs/server.key
        # composer.lock 有變動（或 volume 是空的）才重新安裝套件。
        lock=$$(sha256sum composer.lock | cut -d" " -f1)
        if [ "$$(cat vendor/.composer-lock-hash 2>/dev/null)" != "$$lock" ]; then
          composer install --no-interaction --no-progress --optimize-autoloader && echo "$$lock" > vendor/.composer-lock-hash
        fi
        chown -R www-data:www-data /var/www/html

  app:
    <<: *php
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  queue:
    <<: *php
    command: php artisan queue:work --sleep=1 --tries=1 --timeout=60
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  scheduler:
    <<: *php
    command: php artisan schedule:work
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  web:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/certs:ro
    depends_on:
      init:
        condition: service_completed_successfully
      app:
        condition: service_started
    restart: unless-stopped

  # 本機信箱：接住系統寄出的所有信，不會真的寄出。網頁介面只開在 127.0.0.1:8025，SMTP 只在 Docker 內部。
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

# 固定網段：Docker Desktop 會讓本機連線的來源顯示成閘道 IP，後台白名單只放這一個 IP。
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  pgdata:
  certs:
  vendor:
