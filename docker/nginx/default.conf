# 對外 HTTPS：玩家端、充值網站、管理後台。
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 1m;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    # 伺服器間 API 與 Webhook 只走內部 port。
    location ~ ^/(api|webhooks)(/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        internal;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTPS on;
        # IP 白名單只看連線來源；清掉可偽造的代理標頭。
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# 內部 HTTP：只在 Docker 網路內，只提供簽章 API 與 Webhook。
server {
    listen 80 default_server;
    server_tokens off;
    root /var/www/html/public;
    client_max_body_size 1m;

    location ~ ^/(api|webhooks)/ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR "";
    }

    location / {
        return 404;
    }
}
